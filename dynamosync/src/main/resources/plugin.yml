name: DynamoSync
version: '1.2.0'
main: pl.twojserwer.dynamosync.DynamoSyncPlugin
api-version: '1.21'
author: TwojServer
description: Zapisuje dane i statystyki graczy w AWS DynamoDB (eu-central-1)

commands:
  playerdata:
    description: Odczyt/zapis danych gracza w DynamoDB
    usage: /playerdata <get|set|stats> <gracz> [klucz] [wartosc]  |  /playerdata debug
    permission: dynamosync.admin
  stats:
    description: Pokazuje statystyki gracza (swoje albo wskazanego)
    usage: /stats [gracz]
    aliases: [mystats, statystyki]
    permission: dynamosync.stats

permissions:
  dynamosync.admin:
    description: Dostep do komendy /playerdata
    default: op
  dynamosync.stats:
    description: Dostep do komendy /stats (wlasne statystyki)
    default: true
  dynamosync.stats.others:
    description: Ogladanie statystyk innych graczy przez /stats <gracz>
    default: true
