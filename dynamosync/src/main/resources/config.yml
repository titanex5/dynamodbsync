# === DynamoSync - konfiguracja ===

aws:
  region: eu-central-1
  table-name: Profiles

  # Zostaw puste, zeby uzyc zmiennych srodowiskowych AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  # (zalecane - patrz README.md). Jesli wpiszesz klucze tutaj, PILNUJ zeby config.yml
  # nie trafil do zadnego publicznego repo/backupu.
  access-key: ""
  secret-key: ""

settings:
  # Tworzy tabele w DynamoDB automatycznie przy starcie, jesli jeszcze nie istnieje
  create-table-if-missing: true

  # Co ile sekund plugin zapisuje "w tle" dane graczy online (oprocz zapisu przy wyjsciu).
  # Od wersji z optymalizacja kosztow: autosave zapisuje TYLKO graczy, ktorzy realnie
  # cos zmienili od ostatniego zapisu (dirty-tracking) + wysyla ich paczkami
  # (BatchWriteItem, do 25 na request) zamiast pojedynczo. Wiekszy interwal = mniej WCU.
  autosave-interval-seconds: 300

  # Wlacza szczegolowe logi: rozmiar cache, liczba odczytow/zapisow, ile zapisow
  # pominieto bo dane byly "czyste" (oszczedzone WCU), czas trwania operacji.
  # Sprawdz komenda /playerdata debug - to samo, na zadanie, bez spamu w konsoli.
  debug: false

  # --- Ochrona przed join-flood ---
  # Minimalny odstep (w sekundach) miedzy kolejnymi polaczeniami TEGO SAMEGO konta.
  # Chroni przed graczem/botem, ktory laczy sie i rozlacza w kolko - kazdy join
  # odpala zapytanie do DynamoDB, wiec to bezposrednio ogranicza koszt/throttling.
  # 0 = wylaczone.
  rejoin-cooldown-seconds: 3

  # Minimalny odstep (w sekundach) miedzy kolejnymi probami polaczenia z TEGO SAMEGO
  # adresu IP, niezaleznie od konta. Pomaga przy botach probujacych wielu alt-kont
  # z jednego adresu. 0 = wylaczone.
  ip-join-cooldown-seconds: 1

  # --- Limit zapytan do bazy danych per adres IP ---
  # Maksymalna liczba zapytan do DynamoDB z jednego adresu IP w przesuwanym oknie czasu.
  # Domyslnie: 50 zapytan / 300 s (5 minut). Zapytaniem jest odczyt przy wejsciu gracza
  # (GetItem), odczyty/zapisy z komendy /playerdata oraz zapisy danych gracza (przy wyjsciu,
  # autosave). Trafienie w cache NIE jest zapytaniem do bazy i nie zuzywa limitu.
  #
  # Po wyczerpaniu limitu:
  #  - logowanie z tego IP jest odrzucane z komunikatem "sprobuj za X s",
  #  - komenda /playerdata zwraca ten sam komunikat,
  #  - ZAPISY danych graczy nigdy nie sa gubione - zuzywaja limit, ale zawsze sie wykonuja.
  # Konsola serwera nie ma adresu IP, wiec nie jest limitowana.
  #
  # Uwaga: za proxy (Velocity/BungeeCord) wszyscy gracze moga miec adres proxy - wlacz
  # przekazywanie prawdziwych IP (IP forwarding), inaczej limit zadziala na wszystkich naraz.
  rate-limit:
    enabled: true
    max-requests: 50
    window-seconds: 300

  # --- Twardnienie (v1.1.0) ---
  # Maksymalny czas (w sekundach) na jedno zapytanie do DynamoDB. Zawieszona/wolna baza nie moze
  # trzymac watkow pluginu w nieskonczonosc (i w efekcie blokowac logowan). Dozwolone 2-60.
  # Zwykle zapytanie trwa kilkadziesiat ms, wiec 10 s nie dotyka normalnych graczy.
  db-timeout-seconds: 10

  # Loguje do konsoli kazda zmiane wykonana komenda /playerdata set (kto, komu, jaki klucz/wartosc).
  audit-log: true

# --- Statystyki graczy (v1.2.0) ---
# Liczniki dzialaja tylko w pamieci i leca do bazy razem z autosave / wyjsciem gracza, wiec same w sobie
# NIE dodaja zapytan do DynamoDB (zob. README, sekcja 4c).
stats:
  # Dolicza czas gry i dystans na biezaco (co sample-interval-seconds), a nie tylko przy wyjsciu gracza.
  # Zaleta: crash serwera nie kasuje trwajacej sesji. Wada (drobna): kazdy gracz online jest wtedy "brudny"
  # przy kazdym autosave, czyli ~1 WCU / gracza / autosave. Dla 50 graczy i autosave co 5 min to rzedu
  # 0,5-1 USD miesiecznie. Ustaw false, jesli wolisz minimalizowac zapisy (czas gry liczy sie wtedy przy wyjsciu).
  crash-safe-playtime: true
  sample-interval-seconds: 60   # min. 10

  # Przelaczniki grup statystyk (wylaczona grupa = brak liczenia, zero narzutu).
  track-blocks: true     # bloki wykopane / postawione
  track-damage: true     # obrazenia zadane / otrzymane + zabite moby
  track-chat: true       # liczba wiadomosci na czacie
  track-fishing: true    # zlowione ryby
  track-movement: true   # przebyty dystans (z wbudowanych statystyk Minecrafta)

  # Nie licz blokow/obrazen/ryb w trybie creative (spectator nigdy nie jest liczony).
  ignore-creative-mode: true
