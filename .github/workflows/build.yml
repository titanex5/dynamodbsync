name: Build DynamoSync jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Zbuduj (gradle shadowJar)
        working-directory: dynamosync
        run: gradle shadowJar --no-daemon

      - name: Wystaw jar jako artefakt do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: DynamoSync-jar
          path: dynamosync/build/libs/DynamoSync-*.jar
